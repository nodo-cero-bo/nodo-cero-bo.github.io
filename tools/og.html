<script>
  // Chispas fijas (semilla determinista) y el flujo congelado en un momento lindo.
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const caja = document.getElementById('chispas');
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('i'); d.className = 'chispa';
    const r = 4 + rnd() * 12; d.style.cssText = `left:${560 + rnd() * 640}px;top:${rnd() * 630}px;width:${r}px;height:${r}px;opacity:${.35 + rnd() * .65}`;
    caja.appendChild(d);
  }
  const svg = document.querySelector('.flujo-og svg');
  if (svg) { svg.pauseAnimations(); svg.setCurrentTime(1.42); }
</script>
